    end: 2025-04-01
    summary: |
      Implemented an approach to estimate the universal constant Pi (π) by coupling Grover's Search Algorithm with the classical Galperin Algorithm. This was achieved by mathematically mapping the dynamics of the classical Galperin system directly to the quantum iterations of Grover's algorithm, bridging classical mechanics with quantum search algorithms.

