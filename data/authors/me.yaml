role: Master's Student in Quantum Computing and Machine Learning
bio: |
  I am a master's student who recently completed my MS thesis at the QuCIS Lab, IISER Bhopal, under the supervision of Dr. Ankur Raina. My research primarily focuses on the trainability of Quantum Circuit Born Machines (QCBMs) and quantum generative modeling. Specifically, I have investigated how circuit descriptors like expressibility and entanglement capability in Variational Quantum Circuits impact model performance. Furthermore, I have explored the role of loss functions in the trainability and accuracy of Variational Quantum Algorithms (VQAs), culminating in novel findings in the behavior of Sinkhorn Divergence, an optimal transport based metric, and a new training approach to improve the performance of the loss function in terms of trainability and accuracy of the generative model. This research has contributed to two manuscripts, including one published paper and another currently under review. Moving forward, I am eager to deepen my exploration of the intersection between physics and machine learning, while also diversifying my research to encompass fundamental quantum algorithms.

